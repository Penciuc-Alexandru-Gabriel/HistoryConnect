services:
  app:
    build: .
    container_name: historyconnect-app
    ports:
      - "8080:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - AdminSettings__CodInvitatie=${ADMIN_COD_INVITATIE}
      - EmailSettings__SmtpHost=smtp4dev
      - EmailSettings__SmtpPort=25
      - EmailSettings__EnableSsl=false
      - EmailSettings__FromEmail=noreply@historyconnect.local
    volumes:
      - dp_keys:/app/DataProtection-Keys
    depends_on:
      - postgres
      - smtp4dev
    networks:
      - historyconnect-network

  postgres:
    image: postgres:16-alpine
    container_name: historyconnect-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - historyconnect-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: historyconnect-pgadmin
    restart: always
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - historyconnect-network

  smtp4dev:
    image: rnwood/smtp4dev
    container_name: historyconnect-smtp4dev
    restart: always
    ports:
      - "5080:80"
      - "2525:25"
    networks:
      - historyconnect-network

volumes:
  postgres_data:
  dp_keys:

networks:
  historyconnect-network:
    driver: bridge